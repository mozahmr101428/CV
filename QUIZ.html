<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pemesanan Ringkas - Poliban DigiCraft</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #1f2d2d;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #ffc6db;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header a {
      color: #c2477f;
      font-size: 14px;
    }

    main {
      max-width: 800px;
      padding: 30px 40px;
    }

    .intro {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 30px;
    }

    .placeholder-img {
      width: 200px;
      height: 260px;
      flex-shrink: 0;
      border: 2px solid #ffc6db;
      background-color: #fff0f6;
      border-radius: 4px;
      overflow: hidden;
    }

    .placeholder-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .intro h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .intro p {
      margin: 0;
      font-size: 14px;
      color: #c2477f;
      line-height: 1.5;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 2px solid #ffc6db;
      border-radius: 8px;
      margin-bottom: 30px;
      font-size: 14px;
    }

    th, td {
      border: 1px solid #ffc6db;
      padding: 14px 16px;
      text-align: left;
    }

    th {
      background-color: #ffe3ee;
    }

    .form-box {
      width: 420px;
      max-width: 100%;
      border: 2px solid #ffc6db;
      border-radius: 8px;
      padding: 20px;
    }

    .form-box h2 {
      margin: 0 0 16px;
      font-size: 16px;
    }

    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 14px;
    }

    .form-row label {
      width: 110px;
      font-size: 14px;
    }

    .form-row input,
    .form-row select {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid #ffc6db;
      border-radius: 6px;
      font-size: 14px;
      background-color: #ffffff;
    }

    .form-row input:focus,
    .form-row select:focus {
      outline: none;
      border-color: #c2477f;
    }

    button {
      padding: 8px 16px;
      background-color: #ffc6db;
      border: 2px solid #ffc6db;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background-color: #ffb0cd;
    }

    @media (max-width: 600px) {
      header, main {
        padding-left: 16px;
        padding-right: 16px;
      }
      .intro {
        flex-direction: column;
      }
      .form-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .form-row input,
      .form-row select {
        width: 100%;
      }
    }
  </style>
</head>
